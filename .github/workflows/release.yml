name: release

# Runs on annotated tags matching v*. Tag and push from a fully tested
# commit:
#
#   npm version patch     # or minor / major — bumps package.json + commits + tags
#   git push --follow-tags
#
# Once the tag arrives, this workflow runs the same checks CI does, builds
# the package, and publishes to npm with provenance (sigstore-signed by
# GitHub OIDC). Consumers can verify the package's provenance with
# `npm install --provenance` or `npm view <pkg> ... --json`.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build + publish (with provenance)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Provenance requires:
    #   - id-token: write (OIDC)
    #   - contents: write (only used by the final "Create GitHub Release" step)
    permissions:
      contents: write
      id-token: write

    # When you want a manual-approval gate before each publish, configure
    # an `npm-publish` Environment in repo Settings → Environments with a
    # required reviewer, copy NPM_TOKEN into the environment's secrets,
    # then uncomment the block below.
    #
    # environment:
    #   name: npm-publish

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install (npm ci)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the version on the tag matches package.json
        run: |
          TAG="${GITHUB_REF##refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Inspect the tarball before publish (no secrets leaked)
        run: npm pack --dry-run

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Pull the matching section out of CHANGELOG.md and write it to a file.
      # Using --notes-file (vs inline --notes) preserves backticks and other
      # markdown that would otherwise be eaten by shell expansion when the
      # notes get substituted into the gh release command.
      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF##refs/tags/v}"
          awk -v ver="$TAG" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG entry for v$TAG; release body will be a stub"
            echo "(no changelog entry — see commit history)" > release-notes.md
          fi
          echo "::group::release-notes.md preview"
          cat release-notes.md
          echo "::endgroup::"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag

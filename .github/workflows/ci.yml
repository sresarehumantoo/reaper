name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum permissions — no write access to anything.
permissions:
  contents: read

# Cancel an in-flight run for the same ref when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + verify artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify committed artifacts have not drifted
        run: |
          cd examples/etherhiding
          sha256sum -c SHA256SUMS

      - name: Smoke-test the deobfuscator end-to-end
        run: |
          mkdir -p build/ci
          # --no-fold: assert the string-array rewrite stage reproduces the
          # committed artifact bit-for-bit. The constant-folding pass (on by
          # default in --rewrite) intentionally transforms the output further
          # and is covered by unit tests.
          npx tsx src/cli.ts examples/etherhiding/sample.html --rewrite build/ci --no-fold
          diff build/ci/examples__etherhiding__sample.data-uri-0.deobf.js \
               examples/etherhiding/artifacts/stage1/payload.deobf.js

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
